name: Verify mathematical research baselines
on:
  workflow_dispatch:
  schedule:
    - cron: "24 10 * * 1"
jobs:
  reproduce:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact Ramsey benchmark
        run: python3 scripts/ramsey.py demo
      - name: Independently replay McKay's published 328 K42 Ramsey graphs
        run: python3 scripts/verify_mckay.py --check
      - name: Reproduce full-support Frankl n5 count and canonical n4 orbit partition
        run: python3 scripts/frankl_canonical.py --check
      - name: Independently count all n5 Frankl full-support orbits by Burnside
        run: python3 scripts/frankl_burnside.py --check
      - name: Exact union-closed benchmark
        run: python3 scripts/union_closed.py exhaustive --n 4
      - name: Exact directed-graph benchmark
        run: python3 scripts/digraph.py exhaustive --n 4
      - name: Symmetry-certified five-vertex directed-graph census
        run: python3 scripts/digraph_orbits.py --n 5
      - name: Reproduce exact 18-vertex SAT encoding hash and small-model equivalence
        run: python3 -m unittest discover -s tests -p "test_ch_sat.py" -v
      - name: Verify compact exact-outdegree SAT semantics and pinned hash
        run: python3 -m unittest discover -s tests -p "test_ch_compact.py" -v
      - name: Check research ledger and execution queue
        run: python3 scripts/research.py --check
      - name: Exact probe lab, deep level (all probes re-searched and independently re-checked)
        run: python3 scripts/lab.py --level deep --check
