name: Lean proof gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Lean via elan
        run: |
          curl --fail --location --retry 3 https://raw.githubusercontent.com/leanprover/elan/v4.1.2/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: python3 -m unittest discover -s tests -p test_lean_verify.py -v
      - run: python3 scripts/lean_verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-evidence-${{ github.sha }}
          path: |
            lean/verification.json
            lean/axioms.log
          if-no-files-found: ignore
