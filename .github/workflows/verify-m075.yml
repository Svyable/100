name: M075 proof-carrying finite certificate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-m075.yml'
      - 'scripts/frankl_triple_capped.py'
      - 'scripts/frankl_triple_sat.py'
      - 'scripts/verify_frankl_triple_cert.py'
      - 'tests/test_frankl_triple_capped.py'
      - 'proofs/certificates/m075_triple7_cap18*'
      - 'proofs/M075_TRIPLE7_CAP18.md'
      - 'examples/FRANKL_VAN_DER_HOUT_ROOS_19.json'
  pull_request:
    paths:
      - '.github/workflows/verify-m075.yml'
      - 'scripts/frankl_triple_capped.py'
      - 'scripts/frankl_triple_sat.py'
      - 'scripts/verify_frankl_triple_cert.py'
      - 'tests/test_frankl_triple_capped.py'
      - 'proofs/certificates/m075_triple7_cap18*'
      - 'proofs/M075_TRIPLE7_CAP18.md'
      - 'examples/FRANKL_VAN_DER_HOUT_ROOS_19.json'

jobs:
  external-proof-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact semantics, fault injection and byte-integrity tests
        run: |
          python3 -m unittest discover -s tests -p 'test_frankl_triple_capped.py' -v
          python3 scripts/verify_frankl_triple_cert.py --check
      - name: Build independently pinned DRAT and LRAT checkers
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/marijnheule/drat-trim.git /tmp/m075-drat-trim
          git -C /tmp/m075-drat-trim checkout -q 2e5e29cb0019d5cfd547d4208dca1b3ec290349f
          test "$(git -C /tmp/m075-drat-trim rev-parse HEAD)" = "2e5e29cb0019d5cfd547d4208dca1b3ec290349f"
          make -s -C /tmp/m075-drat-trim drat-trim lrat-check
      - name: Validate full DRAT, reconstruct and replay LRAT, reject false proof
        run: |
          python3 scripts/verify_frankl_triple_cert.py --check \
            --drat-trim /tmp/m075-drat-trim/drat-trim \
            --lrat-check /tmp/m075-drat-trim/lrat-check
