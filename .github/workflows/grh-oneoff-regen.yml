name: Temporary GRH source regeneration
on:
  push:
    branches:
      - research/grh-2026-scope-audit
permissions:
  contents: write
jobs:
  generate:
    if: github.repository == 'Svyable/100' && github.ref == 'refs/heads/research/grh-2026-scope-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate from canonical source files
        run: |
          python3 scripts/regen.py
          python3 scripts/regen.py --check --fast
          python3 -m unittest discover -s tests -p 'test_grh_dependency_audit.py' -v
      - name: Commit generated files only to this scoped branch
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'regen: update generated GRH site artifacts'
            git push origin HEAD:refs/heads/research/grh-2026-scope-audit
          fi
